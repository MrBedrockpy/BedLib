plugins {
    id "java"
    id 'maven-publish'
    id "xyz.jpenilla.run-paper" version "2.3.1"
    id "com.gradleup.shadow" version "9.0.0-beta13"
}

group = "ru.mrbedrockpy"
version = "1.4.9"
def artifact = "BedLib"

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url "https://repo.panda-lang.org/releases"
    }
    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.19.4-R0.1-SNAPSHOT"
    compileOnly "org.projectlombok:lombok:1.18.34"
    compileOnly 'me.clip:placeholderapi:2.12.2'
    annotationProcessor "org.projectlombok:lombok:1.18.34"
    implementation "dev.rollczi:litecommands-bukkit:3.10.2"
    implementation "io.github.classgraph:classgraph:4.8.171"

    compileOnly fileTree("./libs")
}

shadowJar {
    configurations = project.configurations.named('runtimeClasspath').map { [it] }
    archiveFileName = "${project.name}-${project.version}.jar"
}

runServer {
    minecraftVersion "1.20.1"
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = group
            artifactId = artifact
            version = version
        }
    }
    repositories {
        maven {
            name = "Nexus"
            def baseUrl = "https://repo.mrbedrockpy.ru/repository"
            url = version.endsWith('SNAPSHOT') ? "$baseUrl/maven-snapshots/" : "$baseUrl/maven-releases/"
            credentials {
                username = project.findProperty("nexusUsername") ?: System.getenv("NEXUS_USERNAME")
                password = project.findProperty("nexusPassword") ?: System.getenv("NEXUS_PASSWORD")
            }
        }
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
